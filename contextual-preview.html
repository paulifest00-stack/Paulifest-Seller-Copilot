*{box-sizing:border-box}body{font:13px system-ui;background:#f5f6f7;color:#303b36;margin:0}.demo{background:#fff4df;color:#85622a;text-align:center;padding:8px;font-size:11px}header{height:58px;background:white;border-bottom:1px solid #e2e7e4;padding:0 30px;display:flex;align-items:center;gap:26px}header b{color:#25835e;font-size:22px}header span{color:#74827a}main{max-width:1100px;padding:30px;margin:auto}.crumb{font-size:11px;color:#8b978f;margin-bottom:15px}.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:10px}h1{font-size:24px;font-weight:600;margin:0}button{font:inherit;cursor:pointer;padding:8px 13px;background:white;color:#42604e;border:1px solid #d5dfd9;border-radius:5px}button:hover{background:#f2f7f4}.tabs{display:flex;gap:7px;flex-wrap:wrap}.surface{background:white;border:1px solid #e0e6e2;border-radius:7px;padding:25px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:23px 28px}.wide{grid-column:1/-1}h3{font-size:14px;font-weight:600;margin:0 0 22px;border-bottom:1px solid #edf0ee;padding-bottom:14px}label{display:block;font-size:12px;color:#5c6c61;margin-bottom:7px}input,textarea{width:100%;font:inherit;border:1px solid #cfd9d2;border-radius:4px;padding:10px;color:#34473b;background:white}input:focus,textarea:focus{outline:2px solid #75b197;outline-offset:1px}.hint{color:#939c97;font-size:11px;margin-top:5px}.footer{border-top:1px solid #edf0ee;margin-top:28px;padding-top:18px;display:flex;justify-content:flex-end;gap:10px}.save{background:#24865c;border-color:#24865c;color:white}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:#7b8880;font-size:11px;font-weight:600;background:#f9fbfa}th,td{padding:15px 12px;border-bottom:1px solid #e8edea}td.cost{min-width:170px}#message{color:#61836d;font-size:12px;margin:12px 0}.filters{display:flex;gap:12px;margin-bottom:20px}.filters input{max-width:360px}@media(max-width:650px){main{padding:15px}.surface{padding:16px}.fields{grid-t </style><div class="demo">PRÉVIA LOCAL · Dados fictícios · Salvar aqui altera somente este exemplo</div><header><b id="brand">Bling</b><span>Cadastros</span><span>Vendas</span><span>Estoque</span></header><main><div class="crumb">Cadastros / Produtos</div><div class="heading"><h1 id="heading">Cadastro de produto</h1><div class="tabs"><button id="form">Cadastro</button><button id="list">Lista de produtos</button><button id="ml">Mercado Livre</button></div></div><p id="message" role="status"></p><div id="screen"></div></main><script type="module">
import {BlingFormAssistant} from './src/content-scripts/bling/form-assistant.ts';
import {createCostEditor} from './src/content-scripts/bling/cost-editor.ts';
import {installMarketInsights} from './src/content-scripts/mercadolivre/inline-insights.ts';
import {readMarketPage} from './src/content-scripts/mercadolivre/page-reader.ts';
const assistant=new BlingFormAssistant(),screen=document.querySelector('#screen');let stop;
function costControl(parent,initial){let cost=initial;const label=document.createElement('span');const render=()=>label.textContent=cost===null?'Não informado':cost.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});render();parent.append(label);parent.append(createCostEditor({successMessage:'Custo atualizado apenas nesta prévia.',getCost:()=>cost,isCurrent:()=>parent.isConnected,save:async(value)=>({ok:true,cost:value}),onSaved:value=>{cost=value;render();document.querySelector('#message').textContent='Custo alterado apenas na prévia. Na extensão, Salvar custo envia a alteração ao Bling.';}}));}
function show(mode){assistant.destroy();stop?.();stop=undefined;document.querySelector('#message').textContent='';document.querySelector('#brand').textContent=mode==='ml'?'Mercado Livre':'Bling';document.querySelector('#heading').textContent=mode==='form'?'Cadastro de produto':mode==='list'?'Produtos':'Resultados da busca';
if(mode==='form'){screen.innerHTML='<form class="surface" onsubmit="return false"><h3>Informações do produto</h3><div class="fields"><div class="wide"><label for="nome">Nome do produto</label><input id="nome" value="Copo americano azul 200 ml"></div><div><label for="codigo">Código (SKU)</label><input id="codigo" placeholder="Código do produto"></div><div><label for="gtin">GTIN / EAN</label><input id="gtin" placeholder="Código de barras"></div><div><label for="preco">Preço de venda</label><input id="preco" value="19,90"><div class="hint">Valor de venda do produto</div></div><div><label>Preço de custo</label><div id="cost" style="padding:9px 0"></div></div><div><label for="marca">Marca</label><input id="marca" value="Exemplo"></div><div><label for="ncm">NCM</label><input id="ncm" placeholder="Informe o NCM"></div><div class="wide"><label for="descricaoComplementar">Descrição</label><textarea id="descricaoComplementar" rows="3">Copo de vidro azul com capacidade de 200 ml.</textarea></div></div><div class="footer"><button type="button">Cancelar</button><button class="save" type="button" id="save-demo">Salvar cadastro</button></div></form>';assistant.start();costControl(document.querySelector('#cost'),8.5);document.querySelector('#save-demo').onclick=()=>document.querySelector('#message').textContent='Prévia: nenhum cadastro foi enviado ao Bling.';}
else if(mode==='list'){screen.innerHTML='<div class="surface"><div class="filters"><input placeholder="Buscar produto" aria-label="Buscar produto" id="search"></div><table><thead><tr><th>Produto</th><th>SKU</th><th>Preço de venda</th><th>Preço de custo</th></tr></thead><tbody>'+[['Copo americano azul 200 ml','COPAZ200','19,90'],['Kit festa infantil 12 peças','KITFES12','59,90'],['Spray colorido azul 150 ml','SPR150AZ','24,90']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>R$ ${r[2]}</td><td class="cost"></td></tr>`).join('')+'</tbody></table></div>';screen.querySelectorAll('.cost').forEach((el,i)=>costControl(el,[8.5,null,9.8][i]));document.querySelector('#search').oninput=e=>screen.querySelectorAll('tbody tr').forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(e.target.value.toLowerCase()));}
else{screen.innerHTML='<div class="ui-search-layout" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px">'+[['123456','Copo azul 200 ml','19','90'],['123457','Copo americano azul','24','90'],['123458','Copo de vidro 200 ml','29','90']].map(r=>`<article class="ui-search-layout__item" style="background:white;border:1px solid #e6e6e6;border-radius:5px;overflow:hidden"><div style="height:150px;background:#fafafa;display:grid;place-items:center;color:#88a0bd;font-size:48px">◉</div><div style="padding:16px"><a class="poly-component__title" href="https://produto.mercadolivre.com.br/MLB-${r[0]}-exemplo" style="pointer-events:none;text-decoration:none;color:#4f5960">${r[1]}</a><div class="poly-price__current" style="font-size:24px;margin:14px 0">R$ <span class="andes-money-amount__fraction">${r[2]}</span>,<span class="andes-money-amount__cents">${r[3]}</span></div><small class="poly-component__shipping" style="color:#34855d">Frete exibido no exemplo</small></div></article>`).join('')+'</div>';stop=installMarketInsights(()=>{},()=>readMarketPage(document,'https://lista.mercadolivre.com.br/copo-azul'));}}
document.querySelector('#form').onclick=()=>show('form');document.querySelector('#list').onclick=()=>show('list');document.querySelector('#ml').onclick=()=>show('ml');show('form');
</script></html>
